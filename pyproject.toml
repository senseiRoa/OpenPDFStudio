[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openpdfstudio"
version = "2.0.0"
description = "Comprime, une, divide y opera páginas de PDFs localmente."
readme = "README.md"
authors = [{ name = "Andres", email = "andres@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Utilities",
]
requires-python = ">=3.11"
dependencies = [
    "PyMuPDF>=1.23.0",
    "Pillow>=10.0.0",
    "ttkbootstrap>=1.10.0",
]

[project.urls]
Homepage = "https://github.com/senseiRoa/OpenPDFStudio"
Repository = "https://github.com/senseiRoa/OpenPDFStudio"

[project.scripts]
compress-pdf = "pdf_compressor.cli:compress_main"
merge-pdf = "pdf_compressor.cli:merge_main"
split-pdf = "pdf_compressor.cli:split_main"
pages-pdf = "pdf_compressor.cli:pages_main"
openpdfstudio-gui = "pdf_compressor.gui:main"

[tool.setuptools.packages.find]
where = ["src"]
