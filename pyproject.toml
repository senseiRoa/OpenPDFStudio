[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-compressor"
version = "1.0.0"
description = "Comprime archivos PDF localmente manteniendo la mayor calidad posible."
readme = "README.md"
authors = [{ name = "Andres", email = "andres@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Utilities",
]
requires-python = ">=3.11"
dependencies = [
    "PyMuPDF>=1.23.0",
    "Pillow>=10.0.0",
    "ttkbootstrap>=1.10.0",
]

[project.urls]
Homepage = "https://github.com/andres/pdf-compressor"
Repository = "https://github.com/andres/pdf-compressor"

[project.scripts]
compress-pdf = "pdf_compressor.cli:main"
compress-pdf-gui = "pdf_compressor.gui:main"

[tool.setuptools.packages.find]
where = ["src"]
